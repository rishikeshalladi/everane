<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everane – Stats</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg:#0b1020; --surface:#0f1629; --text:#e7ebf3; --muted:#b1bad4; --border:rgba(255,255,255,0.12);
      --brand:#4f8cff; --brand-600:#3c74f7; --brand-700:#2b63e6;
      --accent:#7de2d1; --danger:#ff6b6b; --success:#22c55e;
      --radius:20px; --shadow:0 10px 30px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.2);
      --container:1200px;
      /* compatibility var */
      --danger-color: var(--danger);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:#f6f8fc; --surface:#ffffff; --text:#111827; --muted:#4b5563; --border:rgba(2,6,23,0.1);
        --shadow:0 8px 24px rgba(0,0,0,.10), 0 1px 6px rgba(0,0,0,.06);
      }
    }

    /* base */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(600px 400px at 10% 0%, color-mix(in oklab, var(--brand) 30%, transparent), transparent),
        radial-gradient(500px 300px at 90% 100%, color-mix(in oklab, var(--accent) 22%, transparent), transparent),
        var(--bg);
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; }

    /* layout */
    .container { max-width: var(--container); margin-inline: auto; padding-inline: clamp(1rem, 3vw, 2rem); }
    .content { margin-left: 240px; min-height: 100vh; padding-block: clamp(2rem, 4vw, 3rem); }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 240px;
      padding: 1rem;
      background: color-mix(in oklab, var(--surface) 88%, transparent);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: .5rem;
      backdrop-filter: blur(6px) saturate(1.1);
    }
    .sidebar a {
      display: block; padding: .75rem .9rem; border-radius: 12px;
      color: var(--muted);
      border: 1px solid transparent;
      transition: .2s ease;
    }
    .sidebar a:hover { color: var(--text); border-color: var(--border); background: color-mix(in oklab, var(--surface) 92%, transparent); transform: translateY(-1px); }
    .sidebar a.active {
      color: #fff;
      background: linear-gradient(180deg, var(--brand), var(--brand-600));
      box-shadow: 0 10px 20px rgba(79,140,255,.35);
    }

    /* Stats page styles */
    .time-range-controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .time-range-btn {
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .time-range-btn:hover {
      color: var(--text);
      border-color: var(--brand);
      background: color-mix(in oklab, var(--brand) 8%, transparent);
    }

    .time-range-btn.active {
      color: #fff;
      background: linear-gradient(180deg, var(--brand), var(--brand-600));
      border-color: var(--brand);
      box-shadow: 0 4px 12px rgba(79,140,255,.3);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stats-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .stats-card h2 {
      margin: 0 0 1.5rem 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .adherence-numbers {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-number {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      min-width: 100px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
    }

    .stat-value.taken-color {
      color: var(--success);
    }

    .stat-value.not-taken-color {
      color: var(--danger);
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
      flex: 1;
    }

    #trend-chart {
      height: 360px !important;
    }

    #adherence-chart {
      max-width: 200px;
      max-height: 200px;
      margin: 0 auto;
    }

    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .empty-state p {
      margin: 0;
      font-size: 1.1rem;
    }

    @media (max-width: 1024px) {
      .charts-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .time-range-controls {
        justify-content: center;
        margin-bottom: 1.5rem;
        gap: 0.4rem;
      }

      .time-range-btn {
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
      }

      .charts-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .adherence-numbers {
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .stat-value {
        font-size: 1.5rem;
      }

      .stat-label {
        font-size: 0.75rem;
      }

      .chart-container {
        height: 160px;
      }

      #trend-chart {
        height: 180px !important;
      }

      #adherence-chart {
        max-width: 120px;
        max-height: 120px;
      }

      .stats-card {
        padding: 1rem;
      }

      .stats-card h2 {
        font-size: 1.1rem;
        margin-bottom: 0.75rem;
      }

      .content {
        padding-block: 1.5rem;
      }
    }

    /* Hamburger menu */
    .menu-toggle { display: none; }
    .hamburger {
      display: none;
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1001;
      width: 44px;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: var(--shadow);
    }
    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text);
      transition: all 0.3s ease;
    }
    
    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.6);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    @media (max-width: 900px) {
      .hamburger { display: flex !important; }
      nav.sidebar {
        position: fixed !important;
        top: 4.2rem !important;
        right: 4rem !important;
        left: auto !important;
        width: 165px !important;
        height: auto !important;
        max-height: fit-content !important;
        min-height: auto !important;
        padding: 0.45rem !important;
        padding-top: 0.45rem !important;
        border: 1px solid var(--border) !important;
        border-right: 1px solid var(--border) !important;
        border-radius: 12px !important;
        flex-direction: column !important;
        flex-wrap: nowrap !important;
        gap: .1rem !important;
        z-index: 1001 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        transform: translateY(-10px) scale(0.95) !important;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s !important;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25), 0 8px 16px rgba(0,0,0,0.15) !important;
        background: var(--surface) !important;
        overflow: visible !important;
        overflow-x: visible !important;
      }
      .menu-toggle:checked ~ .menu-overlay {
        display: block !important;
        opacity: 1 !important;
      }
      .menu-toggle:checked ~ nav.sidebar {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(0) scale(1) !important;
      }
      .content { margin-left: 0 !important; padding-top: 4rem !important; }
      nav.sidebar a { 
        display: block !important;
        text-align: center !important;
        padding: .45rem .6rem !important;
        font-size: 0.85rem !important;
        border-radius: 8px !important;
        background: transparent !important;
        border: none !important;
        border-left: none !important;
        margin: 0 !important;
        font-weight: 500 !important;
        line-height: 1.3 !important;
        flex: none !important;
        transition: background 0.2s ease !important;
      }
      nav.sidebar a:hover {
        background: color-mix(in oklab, var(--brand) 12%, transparent) !important;
        border: none !important;
        transform: none !important;
      }
      nav.sidebar a.active {
        background: linear-gradient(135deg, var(--brand), var(--brand-600)) !important;
        color: white !important;
        border: none !important;
        border-left: none !important;
      }
    }
  
/* === MOBILE CENTERING FIX (STATS PAGE ONLY) === */
@media (max-width: 768px) {
  .container {
    padding-inline: 0.75rem !important;
  }

  h1 {
    text-align: center;
  }

  .charts-grid {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
  }

  .stats-card {
    width: 100% !important;
    max-width: 360px !important;
    margin-inline: auto !important;
  }

  .adherence-numbers {
    align-items: center !important;
    text-align: center !important;
  }

  .stat-number {
    align-items: center !important;
  }

  .chart-container {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  #trend-chart,
  #adherence-chart {
    max-width: 100% !important;
  }

  .empty-state {
    max-width: 360px;
    margin-inline: auto;
  }
}

</style>
</head>
<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </label>
  
  <div class="menu-overlay" onclick="document.getElementById('menu-toggle').checked = false;"></div>
  
  <nav class="sidebar">
    <a href="home.html">Home</a>
    <a href="history.html">History</a>
    <a href="calendar.html">Calendar</a>
    <a href="notes.html">Notes</a>
    <a href="stats.html" class="active">Stats</a>
    <a href="profile.html">Profile</a>
  </nav>

  <div class="content">
    <div class="container">
      <h1>Stats</h1>
      
      <!-- Time Range Controls -->
      <div class="time-range-controls">
        <button class="time-range-btn active" data-range="week">Week</button>
        <button class="time-range-btn" data-range="month">Month</button>
        <button class="time-range-btn" data-range="year">Year</button>
        <button class="time-range-btn" data-range="all">All Time</button>
      </div>

      <!-- Charts Container -->
      <div class="charts-grid">
        <!-- Chart A: Taken vs Not Taken -->
        <div class="stats-card">
          <h2>Adherence Overview</h2>
          <div class="adherence-numbers">
            <div class="stat-number">
              <span class="stat-label">Taken:</span>
              <span class="stat-value taken-color" id="taken-count">0</span>
            </div>
            <div class="stat-number">
              <span class="stat-label">Not Taken:</span>
              <span class="stat-value not-taken-color" id="not-taken-count">0</span>
            </div>
            <div class="stat-number">
              <span class="stat-label">Adherence:</span>
              <span class="stat-value" id="adherence-percent">0%</span>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="adherence-chart"></canvas>
          </div>
        </div>

        <!-- Chart B: Daily Adherence Over Time -->
        <div class="stats-card">
          <h2>Daily Adherence Trend</h2>
          <div class="chart-container">
            <canvas id="trend-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <p>No dose history yet. Mark doses as Taken/Not Taken to see stats.</p>
      </div>
    </div>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6wbL8ubfOSlyodvwuh_1gTL-7FK065pk",
      authDomain: "medtracker-8c467.firebaseapp.com",
      projectId: "medtracker-8c467",
      storageBucket: "medtracker-8c467.firebasestorage.app",
      messagingSenderId: "847799899373",
      appId: "1:847799899373:web:8c4678c4678c4678c467"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.auth = auth;
    window.db = db;

    // Chart instances
    let adherenceChart = null;
    let trendChart = null;
    let currentTimeRange = 'week';

    // Time range button handlers
    document.querySelectorAll('.time-range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.time-range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTimeRange = btn.dataset.range;
        updateCharts();
      });
    });

    // Get date range based on time range selection
    function getDateRange(range) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      switch(range) {
        case 'week':
          const weekStart = new Date(today);
          weekStart.setDate(today.getDate() - 6); // Last 7 days including today
          return { start: weekStart, end: today };
        case 'month':
          const monthStart = new Date(today);
          monthStart.setDate(today.getDate() - 29); // Last 30 days including today
          return { start: monthStart, end: today };
        case 'year':
          const yearStart = new Date(today);
          yearStart.setDate(today.getDate() - 364); // Last 365 days including today
          return { start: yearStart, end: today };
        case 'all':
          return { start: null, end: null };
        default:
          return { start: null, end: null };
      }
    }

    // Load dose logs from Firestore
    async function loadDoseLogs() {
      const user = auth.currentUser;
      if (!user) return [];

      try {
        // Get all medications for the user
        const medicationsRef = collection(db, 'users', user.uid, 'medications');
        const medicationsSnapshot = await getDocs(medicationsRef);
        
        const doseLogs = [];
        
        medicationsSnapshot.forEach(medDoc => {
          const medData = medDoc.data();
          if (medData.deletedStatus) return; // Skip deleted medications
          
          const medicationName = medData.name || 'Unknown';
          const doses = medData.doses || {};
          
          // Convert doses object to array of log entries
          Object.keys(doses).forEach(key => {
            const dose = doses[key];
            if (!dose.date || dose.taken === undefined) return;
            
            // Parse date from YYYY-MM-DD format
            const [year, month, day] = dose.date.split('-').map(Number);
            const scheduledDate = new Date(year, month - 1, day);
            
            // Get scheduled time if available
            let scheduledDateTime = new Date(scheduledDate);
            if (medData.times && Array.isArray(medData.times) && medData.times.length > 0) {
              const sortedTimes = [...medData.times].sort();
              const timeIndex = (dose.doseNumber || 1) - 1;
              if (timeIndex >= 0 && timeIndex < sortedTimes.length) {
                const [hours, minutes] = sortedTimes[timeIndex].split(':').map(Number);
                scheduledDateTime.setHours(hours, minutes, 0, 0);
              }
            }
            
            // Only add if taken is explicitly true or false (not undefined)
            // This includes:
            // - Manually marked doses (taken: true or false)
            // - Auto-marked missed doses (taken: false, autoMarked: true)
            if (dose.taken !== undefined) {
              doseLogs.push({
                medicationName: medicationName,
                scheduledAt: scheduledDateTime,
                status: dose.taken === true ? 'taken' : 'not_taken', // Auto-marked doses will be 'not_taken'
                createdAt: dose.takenAt ? new Date(dose.takenAt) : scheduledDateTime,
                autoMarked: dose.autoMarked === true // Track if this was auto-marked
              });
            }
          });
        });
        
        // Sort by scheduledAt
        doseLogs.sort((a, b) => a.scheduledAt - b.scheduledAt);
        
        return doseLogs;
      } catch (error) {
        console.error('[Stats] Error loading dose logs:', error);
        return [];
      }
    }

    // Filter dose logs by time range
    function filterDoseLogs(doseLogs, range) {
      if (range === 'all') {
        // For "All Time", only include doses that have already passed (or are happening now)
        const now = new Date();
        return doseLogs.filter(log => {
          return log.scheduledAt <= now;
        });
      }
      
      const { start, end } = getDateRange(range);
      const now = new Date();
      
      return doseLogs.filter(log => {
        const logDate = new Date(log.scheduledAt);
        logDate.setHours(0, 0, 0, 0);
        
        // Check if date is in range
        const dateInRange = logDate >= start && logDate <= end;
        
        // For today, only include doses that have already passed (or are happening now)
        // For past dates, include all doses
        if (logDate.getTime() === end.getTime()) {
          // This is today - only include if scheduled time has passed
          return dateInRange && log.scheduledAt <= now;
        } else {
          // This is a past date - include all doses
          return dateInRange;
        }
      });
    }

    // Calculate daily adherence
    function calculateDailyAdherence(doseLogs) {
      const dailyData = {};
      
      doseLogs.forEach(log => {
        const date = new Date(log.scheduledAt);
        date.setHours(0, 0, 0, 0);
        const dateKey = date.toISOString().split('T')[0];
        
        if (!dailyData[dateKey]) {
          dailyData[dateKey] = { taken: 0, total: 0 };
        }
        
        dailyData[dateKey].total++;
        if (log.status === 'taken') {
          dailyData[dateKey].taken++;
        }
      });
      
      // Convert to array and sort by date
      return Object.keys(dailyData)
        .sort()
        .map(date => ({
          date: date,
          taken: dailyData[date].taken,
          total: dailyData[date].total,
          adherence: dailyData[date].total > 0 
            ? (dailyData[date].taken / dailyData[date].total) * 100 
            : 0
        }));
    }

    // Update charts with fade transition
    async function updateCharts() {
      // Fade out
      const chartContainers = document.querySelectorAll('.chart-container, .adherence-numbers, .charts-grid');
      chartContainers.forEach(container => {
        container.style.opacity = '0';
        container.style.transition = 'opacity 150ms ease-out';
      });
      
      setTimeout(async () => {
        const allLogs = await loadDoseLogs();
        const filteredLogs = filterDoseLogs(allLogs, currentTimeRange);
        
        // Show/hide empty state
        const emptyState = document.getElementById('empty-state');
        const chartsGrid = document.querySelector('.charts-grid');
        if (filteredLogs.length === 0) {
          emptyState.style.display = 'block';
          if (chartsGrid) chartsGrid.style.display = 'none';
          return;
        } else {
          emptyState.style.display = 'none';
          if (chartsGrid) chartsGrid.style.display = 'grid';
        }
        
        // Calculate stats
        const taken = filteredLogs.filter(log => log.status === 'taken').length;
        const notTaken = filteredLogs.filter(log => log.status === 'not_taken').length;
        const total = taken + notTaken;
        const adherencePercent = total > 0 ? ((taken / total) * 100).toFixed(1) : 0;
        
        // Update numbers
        document.getElementById('taken-count').textContent = taken;
        document.getElementById('not-taken-count').textContent = notTaken;
        document.getElementById('adherence-percent').textContent = adherencePercent + '%';
        
        // Update adherence chart (donut)
        updateAdherenceChart(taken, notTaken);
        
        // Update trend chart
        const dailyData = calculateDailyAdherence(filteredLogs);
        updateTrendChart(dailyData);
        
        // Fade in
        setTimeout(() => {
          chartContainers.forEach(container => {
            container.style.opacity = '1';
            container.style.transition = 'opacity 150ms ease-in';
          });
        }, 50);
        
        // Animate charts if they support it
        if (adherenceChart) {
          adherenceChart.update('active');
        }
        if (trendChart) {
          trendChart.update('active');
        }
      }, 150);
    }

    // Update adherence donut chart
    function updateAdherenceChart(taken, notTaken) {
      const ctx = document.getElementById('adherence-chart').getContext('2d');
      
      if (adherenceChart) {
        adherenceChart.destroy();
      }
      
      // Ensure we have valid numbers
      const takenValue = Number(taken) || 0;
      const notTakenValue = Number(notTaken) || 0;
      
      console.log('[Stats] Chart data:', { taken: takenValue, notTaken: notTakenValue });
      
      adherenceChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Taken', 'Not Taken'],
          datasets: [{
            data: [takenValue, notTakenValue], // First value = Taken (green), Second = Not Taken (red)
            backgroundColor: [
              'rgba(34, 197, 94, 0.8)', // success green for Taken
              'rgba(255, 107, 107, 0.8)' // danger red for Not Taken
            ],
            borderColor: [
              'rgba(34, 197, 94, 1)', // green border for Taken
              'rgba(255, 107, 107, 1)' // red border for Not Taken
            ],
            borderWidth: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '60%',
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.8)',
              padding: 12,
              titleFont: {
                size: 14,
                weight: '600'
              },
              bodyFont: {
                size: 13
              },
              callbacks: {
                label: function(context) {
                  const label = context.label || '';
                  const value = context.parsed || 0;
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                  return `${label}: ${value} (${percent}%)`;
                }
              }
            }
          }
        }
      });
    }

    // Update trend line chart
    function updateTrendChart(dailyData) {
      const ctx = document.getElementById('trend-chart').getContext('2d');
      
      if (trendChart) {
        trendChart.destroy();
      }
      
      const labels = dailyData.map(d => {
        const date = new Date(d.date);
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      });
      const adherenceData = dailyData.map(d => d.adherence);
      
      trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Adherence %',
            data: adherenceData,
            borderColor: 'rgba(34, 197, 94, 1)',
            backgroundColor: 'rgba(34, 197, 94, 0.15)',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 5,
            pointHoverRadius: 8,
            pointBackgroundColor: 'rgba(34, 197, 94, 1)',
            pointBorderColor: 'rgba(255, 255, 255, 1)',
            pointBorderWidth: 2,
            pointHoverBackgroundColor: 'rgba(34, 197, 94, 1)',
            pointHoverBorderColor: 'rgba(255, 255, 255, 1)',
            pointHoverBorderWidth: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          layout: {
            padding: {
              top: 20,
              bottom: 10
            }
          },
          interaction: {
            intersect: false,
            mode: 'index'
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 110,
              ticks: {
                callback: function(value) {
                  if (value > 100) return '';
                  return value + '%';
                },
                color: '#ffffff',
                font: {
                  size: 12
                },
                padding: 12
              },
              grid: {
                color: 'var(--border)',
                drawBorder: false
              },
              border: {
                display: false
              }
            },
            x: {
              ticks: {
                color: '#ffffff',
                font: {
                  size: 11
                },
                maxRotation: 45,
                minRotation: 0,
                padding: 10
              },
              grid: {
                display: false
              },
              border: {
                display: false
              }
            }
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.85)',
              padding: 14,
              titleColor: '#ffffff',
              bodyColor: '#ffffff',
              titleFont: {
                size: 14,
                weight: '600'
              },
              bodyFont: {
                size: 13
              },
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              cornerRadius: 8,
              displayColors: false,
              callbacks: {
                title: function(context) {
                  return context[0].label;
                },
                label: function(context) {
                  const index = context.dataIndex;
                  const day = dailyData[index];
                  return [
                    `Adherence: ${day.adherence.toFixed(1)}%`,
                    `${day.taken} of ${day.total} doses taken`
                  ];
                }
              }
            }
          }
        }
      });
    }

    // Real-time listener for medication changes
    let unsubscribeMedications = null;

    // Initialize on auth state change
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Set up real-time listener for medications
        const medicationsRef = collection(db, 'users', user.uid, 'medications');
        
        // Unsubscribe from previous listener if it exists
        if (unsubscribeMedications) {
          unsubscribeMedications();
        }
        
        // Set up new real-time listener
        unsubscribeMedications = onSnapshot(medicationsRef, (snapshot) => {
          console.log('[Stats] Medications data changed, updating charts...');
          updateCharts();
        }, (error) => {
          console.error('[Stats] Error in medications listener:', error);
        });
        
        // Initial load
        updateCharts();
      } else {
        // Clean up listener if user logs out
        if (unsubscribeMedications) {
          unsubscribeMedications();
          unsubscribeMedications = null;
        }
      }
    });

    // Hamburger menu toggle functionality
    document.addEventListener('DOMContentLoaded', function() {
      const menuToggle = document.getElementById('menu-toggle');
      const sidebarLinks = document.querySelectorAll('.sidebar a');
      sidebarLinks.forEach(link => {
        link.addEventListener('click', () => {
          menuToggle.checked = false;
        });
      });
    });
  </script>
</body>
</html>
