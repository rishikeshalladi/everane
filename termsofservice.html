<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terms of Service</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f7f8fb; color: #0f172a; }
    .policy {
      max-width: 900px;
      margin: 48px auto 80px;
      padding: 0 20px;
      line-height: 1.65;
      font-size: 16px;
    }
    .policy h1 { font-size: 30px; margin: 0 0 10px; }
    .policy h2 { font-size: 22px; margin: 24px 0 10px; }
    .policy h3 { font-size: 18px; margin: 20px 0 8px; }
    .policy p, .policy div { margin: 0 0 10px; }
    .policy .spacer { height: 14px; }
    .policy a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }
    .policy table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .policy th, .policy td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; vertical-align: top; }
    .policy thead th { background: #f1f5f9; }
    .policy .bullet { position: relative; padding-left: 20px; }
    .policy .bullet::before { content: "•"; position: absolute; left: 0; }
  </style>
</head>
<body>
  <main class="policy">
    
  </main>
</body>
</html>
