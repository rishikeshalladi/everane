<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <title>Everane – Renew Medication</title>
  <link rel="stylesheet" href="styles.css">
  <script src="med-image.js"></script>
</head>

<body>
  <header class="topbar">
    <button class="hamburger" aria-label="Toggle menu">☰</button>
  </header>
  <nav class="sidebar">
    <a href="home.html">Home</a>
    <a href="history.html">History</a>
    <a href="calendar.html">Calendar</a>
    <a href="notes.html">Notes</a>
    <a href="stats.html">Stats</a>
    <a href="medicom.html">Communication</a>
    <a href="profile.html">Profile</a>
  </nav>
  <div class="content">
    <h1>Renew Medication</h1>
    <div class="medimg-inline-row">
      <div>
        <label for="renew-name">Medication Name</label>
        <input id="renew-name" type="text">
        <div id="renew-summary-mount" aria-live="polite"></div>
      </div>
      <div id="renew-image-mount" aria-live="polite"></div>
    </div>

    <label for="renew-dosage">Dosage (how many pills)</label>
    <input id="renew-dosage" type="text">

    <label for="renew-frequency">Frequency</label>
    <input id="renew-frequency" type="text">

    <label for="renew-time">Time of taking <small>(optional)</small></label>
    <input id="renew-time" type="time">

    <div style="display:flex; gap:1rem;">
      <div style="flex:1;">
        <label>Start Date</label>
        <input type="date">
      </div>
      <div style="flex:1;">
        <label style="color:var(--danger-color)">End Date <small>(opt.)</small></label>
        <input type="date">
      </div>
      <div style="flex:1;">
        <label>Expiration</label>
        <input type="date">
      </div>
    </div>

    <label>Reminder Method <small>(pick any combination)</small></label>
    <div id="renew-reminder-channels" style="display:flex;flex-direction:column;gap:.4rem;">
      <label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" class="renew-reminder-channel" value="email"> Email</label>
      <label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" class="renew-reminder-channel" value="sms"> SMS</label>
      <label style="display:flex;gap:.5rem;align-items:center;"><input type="checkbox" class="renew-reminder-channel" value="push"> Push notification</label>
    </div>

    <button class="btn btn-primary">Save</button>
  </div>
<script>
  const sidebar = document.querySelector('.sidebar');
  document.querySelector('.hamburger')
    .addEventListener('click', () => sidebar.classList.toggle('open'));
  document.querySelectorAll('.sidebar a')
    .forEach(link => link.addEventListener('click', () => {
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }));

  // Mount the saved medication image inline (top-right on desktop, above on
  // mobile). Pulls from the tempRenewMed payload that the home page sets when
  // the user taps Renew on a deleted med card.
  try {
    const arr = JSON.parse(localStorage.getItem('tempRenewMed') || '[]');
    const params = new URLSearchParams(location.search);
    const idx = parseInt(params.get('renewIdx') || '0', 10);
    const src = Number.isFinite(idx) ? arr[idx] : null;
    if (src && src.imageUrl && window.MedImage) {
      const mount = document.getElementById('renew-image-mount');
      if (mount) mount.appendChild(window.MedImage.renderInlineCard({
        imageUrl: src.imageUrl,
        canonical: src.imageCanonical || src.name || null,
        genericName: src.imageGenericName || null,
      }));
      if (src.imageSummary && window.MedImage.renderSummary) {
        const sMount = document.getElementById('renew-summary-mount');
        const box = window.MedImage.renderSummary({
          summary: src.imageSummary,
          canonical: src.imageCanonical || src.name || null,
        });
        if (sMount && box) sMount.appendChild(box);
      }
    }
  } catch (_) {}
</script>
</body>
</html>
