<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedTracker – Renew Medication</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <button class="hamburger" aria-label="Toggle menu">☰</button>
  </header>
  <nav class="sidebar">
    <a href="home.html">Home</a>
    <a href="history.html">History</a>
    <a href="calendar.html">Calendar</a>
    <a href="notes.html">Notes</a>
    <a href="stats.html">Stats</a>
    <a href="profile.html">Profile</a>
  </nav>
  <div class="content">
    <h1>Renew Medication</h1>
    <label for="renew-name">Medication Name</label>
    <input id="renew-name" type="text">

    <label for="renew-dosage">Dosage (how many pills)</label>
    <input id="renew-dosage" type="text">

    <label for="renew-frequency">Frequency</label>
    <input id="renew-frequency" type="text">

    <label for="renew-time">Time of taking <small>(optional)</small></label>
    <input id="renew-time" type="time">

    <div style="display:flex; gap:1rem;">
      <div style="flex:1;">
        <label>Start Date</label>
        <input type="date">
      </div>
      <div style="flex:1;">
        <label style="color:var(--danger-color)">End Date <small>(opt.)</small></label>
        <input type="date">
      </div>
      <div style="flex:1;">
        <label>Expiration</label>
        <input type="date">
      </div>
    </div>

    <label for="renew-reminder">Reminder Method</label>
    <select id="renew-reminder">
      <option>None</option>
      <option>Email</option>
      <option>SMS</option>
    </select>

    <button class="btn btn-primary">Save</button>
  </div>
<script>
  const sidebar = document.querySelector('.sidebar');
  document.querySelector('.hamburger')
    .addEventListener('click', () => sidebar.classList.toggle('open'));
  document.querySelectorAll('.sidebar a')
    .forEach(link => link.addEventListener('click', () => {
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }));
</script>
</body>
</html>
