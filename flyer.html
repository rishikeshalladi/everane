<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <title>Everane Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #e8e0d8;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    .flyer {
      width: 850px;
      height: 1100px;
      background: #FFF9F0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top accent */
    .top-bar {
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #7BA68A, #5A8A6A, #D4845A);
    }

    /* Logo + name */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 52px;
    }

    .brand img {
      width: 52px;
      height: 52px;
    }

    .brand span {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 36px;
      color: #2C2C2C;
      letter-spacing: 0.5px;
    }

    /* Headline */
    .headline {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 52px;
      color: #2C2C2C;
      text-align: center;
      line-height: 1.2;
      margin-top: 36px;
      max-width: 620px;
    }

    .headline span {
      color: #5A8A6A;
    }

    /* Tags row */
    .tags {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tag {
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .tag.green {
      background: #D4E8DA;
      color: #3d6b4e;
    }

    .tag.peach {
      background: #F0D4C0;
      color: #8b5a38;
    }

    .tag.blue {
      background: #D0E4F7;
      color: #3a6a8a;
    }

    /* QR area — the star */
    .qr-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .scan-label {
      font-size: 13px;
      font-weight: 700;
      color: #5A8A6A;
      text-transform: uppercase;
      letter-spacing: 2.5px;
    }

    .qr-frame {
      background: white;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .qr-frame img {
      width: 320px;
      height: 320px;
      display: block;
    }

    .qr-sub {
      font-size: 15px;
      color: #8A8A8A;
      font-weight: 500;
    }

    /* Footer */
    .footer {
      width: 100%;
      background: #5A8A6A;
      padding: 24px 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 22px;
      color: white;
    }

    .free-pill {
      background: white;
      color: #5A8A6A;
      font-size: 15px;
      font-weight: 800;
      padding: 10px 28px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }

    @media print {
      body { background: white; }
      .flyer { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="top-bar"></div>

    <div class="brand">
      <img src="logo.svg" alt="Everane">
      <span>Everane</span>
    </div>

    <h1 class="headline">Never Miss a <span>Medication</span> Again</h1>

    <div class="tags">
      <span class="tag green">SMS & Email Reminders</span>
      <span class="tag peach">Caregiver Support</span>
      <span class="tag blue">AI Voice Features</span>
    </div>

    <div class="qr-area">
      <span class="scan-label">Scan to join the waitlist</span>
      <div class="qr-frame">
        <img id="qr-img" src="" alt="QR Code">
      </div>
      <span class="qr-sub">Point your camera at the code above</span>
    </div>

    <div class="footer">
      <span class="footer-text">everane.live</span>
      <span class="free-pill">Completely Free</span>
    </div>
  </div>

  <script>
    const qrImg = document.getElementById('qr-img');
    const savedQR = localStorage.getItem('everane-flyer-qr');
    if (savedQR) {
      qrImg.src = savedQR;
    } else {
      const ph = document.createElement('div');
      ph.style.cssText = 'width:320px;height:320px;display:flex;align-items:center;justify-content:center;border:2px dashed #ccc;border-radius:16px;color:#999;font-size:14px;font-weight:600;text-align:center;cursor:pointer;';
      ph.textContent = 'Click to upload QR code';
      qrImg.style.display = 'none';
      qrImg.parentElement.appendChild(ph);
      ph.addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = (e) => {
          const f = e.target.files[0]; if (!f) return;
          const r = new FileReader();
          r.onload = (ev) => { qrImg.src = ev.target.result; qrImg.style.display = 'block'; ph.remove(); localStorage.setItem('everane-flyer-qr', ev.target.result); };
          r.readAsDataURL(f);
        };
        inp.click();
      });
    }
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (!f || !f.type.startsWith('image/')) return;
      const r = new FileReader();
      r.onload = (ev) => { qrImg.src = ev.target.result; qrImg.style.display = 'block'; localStorage.setItem('everane-flyer-qr', ev.target.result); document.querySelector('.qr-frame div')?.remove(); };
      r.readAsDataURL(f);
    });
  </script>
</body>
</html>
